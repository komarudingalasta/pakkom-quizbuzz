<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAKKOM-QUIZBUZZ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">PAKKOM-<span>QUIZBUZZ</span></div>
  <div class="badge">CERDAS CERMAT</div>
</header>

<main class="container">
  <section id="home" class="card hero">
    <div class="logo">PB</div>
    <h1>PAKKOM-QUIZBUZZ</h1>
    <p>Bel cerdas cermat dengan sistem skor.</p>
    <div class="buttons">
      <button id="createBtn">Buat Permainan</button>
      <button id="joinBtn" class="secondary">Gabung Permainan</button>
    </div>
  </section>

  <section id="create" class="card hidden">
    <h2>Buat Permainan</h2>
    <div class="form-grid">
      <label>Jumlah maksimal tim
        <input id="maxTeams" type="number" min="2" max="50" value="5">
      </label>
      <label>Nilai benar
        <input id="correctScore" type="number" value="10">
      </label>
      <label>Pengurangan salah
        <input id="wrongScore" type="number" value="5">
      </label>
    </div>
    <div class="buttons">
      <button id="makeRoomBtn">Buat Room</button>
      <button class="secondary" id="back1">Kembali</button>
    </div>
  </section>

  <section id="join" class="card hidden">
    <h2>Gabung Permainan</h2>
    <label>Kode permainan
      <input id="roomCode" maxlength="8" placeholder="ABC123" style="text-transform:uppercase">
    </label>
    <div class="buttons">
      <button id="continueJoinBtn">Lanjut</button>
      <button class="secondary" id="back2">Kembali</button>
    </div>
  </section>

  <section id="team" class="card hidden">
    <h2>Masuk sebagai Tim</h2>
    <p id="roomInfo" class="muted"></p>
    <label>Nama tim
      <input id="teamName" maxlength="25" placeholder="Contoh: Garuda">
    </label>
    <div class="buttons">
      <button id="enterTeamBtn">Masuk</button>
    </div>
  </section>

  <section id="game" class="hidden">
    <div class="card">
      <div class="row">
        <div><h2 id="gameTitle">Ruang Permainan</h2><span id="slotInfo" class="badge"></span></div>
        <button id="homeBtn" class="secondary">Keluar</button>
      </div>
      <div id="codeBox" class="code"></div>
    </div>

    <div class="card">
      <h2>Papan Skor</h2>
      <div id="scoreboard"></div>
    </div>

    <div id="hostControls" class="card hidden">
      <h2>Kontrol Pembuat</h2>
      <div id="winnerBox"></div>
      <div class="buttons">
        <button id="openBellBtn">Buka Bel</button>
        <button id="correctBtn" class="good hidden">✓ BENAR</button>
        <button id="wrongBtn" class="bad hidden">✕ SALAH</button>
      </div>
    </div>

    <div id="playerControls" class="card center hidden">
      <div id="playerStatus"></div>
      <button id="buzzBtn" class="buzz">BEL</button>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
